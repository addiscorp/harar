[package]
name = "gild-vault-proxy"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "gild-vault-proxy"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { workspace = true }
gild-vault-client = { path = "../gild-vault-client" }
hyper = { workspace = true }
hyper-util = { workspace = true, features = ["server", "http1", "http2", "tokio"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
rustls = "0.23"
rustls-pemfile = "2"
rustls-pki-types = "1"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-rustls = "0.26"
x509-parser = "0.16"

[dev-dependencies]
age = "0.11.3"
rcgen = "0.12"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"
tower = "0.5"
