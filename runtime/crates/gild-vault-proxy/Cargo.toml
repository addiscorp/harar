[package]
name = "gild-vault-proxy"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "gild-vault-proxy"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { workspace = true }
gild-vault-client = { path = "../gild-vault-client" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }

[dev-dependencies]
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"
tower = "0.5"
