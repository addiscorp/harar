[package]
name = "gild-vault-client"
version = "0.1.0"
edition = "2021"
description = "Rust SDK for reading secrets from gild-vault"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "sync"] }

[dev-dependencies]
tempfile = "3"
