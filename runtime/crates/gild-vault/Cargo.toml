[package]
name = "gild-vault"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "tana-vault-agent"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
jsonwebtoken = "9"
libc = "0.2"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = "0.10"
tokio = { workspace = true, features = ["full"] }
toml = { workspace = true }
tss-esapi = { version = "7.7", optional = true }

[features]
default = []
tpm = ["dep:tss-esapi"]

[dev-dependencies]
tempfile = "3"
