[package]
name = "gild-vault"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "gild-vault"
path = "src/main.rs"

[dependencies]
age = "0.11.3"
anyhow = "1"
libc = "0.2"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }

[dev-dependencies]
tempfile = "3"
