[package]
name = "harar-server"
version.workspace = true
edition = "2024"
license.workspace = true
# The binary installs from harar-releases, never from a registry (APS 13).
publish = false

[[bin]]
name = "harar"
path = "src/main.rs"

[dependencies]
aes = "0.8"
aes-gcm = "0.10"
age = "0.11.3"
anyhow = "1"
chacha20poly1305 = "0.10"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
harar = { workspace = true }
hkdf = "0.12"
hmac = "0.12"
libc = "0.2"
p256 = { version = "0.13", features = ["ecdh", "ecdsa", "std"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = "0.10"
tokio = { workspace = true, features = ["full"] }
tokio-postgres = "0.7"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
security-framework = "3.7"
security-framework-sys = "2.17"

[dev-dependencies]
tempfile = "3"
