[workspace]
# client/ is the `harar` crate on crates.io, the way Rust programs talk to
# harar. server/ is the harar binary (package harar-server, never published;
# it installs from harar-releases). Both share one version, the release's.
members = [
    "client",
    "server",
]
resolver = "2"

[workspace.package]
version = "0.3.1"
license = "MIT"

[workspace.dependencies]
axum = "0.7"
harar = { path = "client", version = "0.3.1" }
hyper = "1"
hyper-util = "0.1"
serde = "1"
serde_json = "1"
tokio = "1"
