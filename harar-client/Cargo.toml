[package]
name = "harar-client"
version = "0.2.1"
edition = "2021"
license = "Apache-2.0"
description = "Rust SDK for reading secrets from Harar"

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
seam_ir = { path = "../seam_ir" }
tokio = { workspace = true, features = ["io-util", "net", "sync", "rt", "macros"] }
p256 = { version = "0.13", features = ["ecdsa", "std"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
