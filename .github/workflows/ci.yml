name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The npm package `harar` (import { vault } from 'harar'): its tests on
  # Node and on Bun, and what it would publish.
  js:
    runs-on: mirab-linux-arm64
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: npm test
      - run: bun test test/
      - run: npm pack --dry-run

  # The PyPI, RubyGems and Packagist clients (python/, ruby/, php/ with the
  # root composer.json): each one's tests on its oldest and newest supported
  # runtime, the package it would publish, and the release version it carries.
  clients:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-clients.sh

  python:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: pip install build==1.2.2.post1 && python -m build --outdir ../dist

  ruby:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        ruby: ["3.0", "3.4"]
    defaults:
      run:
        working-directory: ruby
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: ${{ matrix.ruby }}
      - run: ruby -Ilib test/vault_test.rb
      - run: ruby -Ilib test/edge_test.rb
      - run: gem build harar.gemspec

  php:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php: ["8.1", "8.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          tools: composer
      - run: composer validate --strict
      - run: php php/tests/vault_test.php
      - run: php php/tests/edge_test.php
      # What a user's Composer autoloads: Harar\vault and Harar\Vault, from the root composer.json.
      - run: composer dump-autoload
      - run: |
          php -r 'require "vendor/autoload.php"; exit(Harar\vault(socket: "/run/harar.sock") instanceof Harar\Vault ? 0 : 1);'

  # harar edge (edge/, docs/edge.md): the one-file API's tests on SQLite and
  # on Postgres, its types, and each platform's entry file typechecked
  # against it (tsc for Cloudflare and Vercel, deno check for Supabase).
  edge:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: edge-test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    defaults:
      run:
        working-directory: edge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          HARAR_TEST_POSTGRES: postgres://postgres:edge-test@127.0.0.1:5432/postgres
      - run: test/check-platforms.sh

  # The Go module github.com/addiscorp/harar/go: its tests on the oldest Go
  # it supports and the newest, and gofmt and vet clean.
  go:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        go: ["1.21", "stable"]
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race -v ./...

  linux:
    runs-on: ubuntu-24.04  # needs Docker; mirab VMs gain it with the full kernel
    # Compilation is cached in R2. public-ci holds only the key for this
    # repo's sccache buckets (the dsc model); publishing keys are in release.
    environment: public-ci
    # A throwaway Postgres for the secret store's tests. The password only
    # guards this job's own container.
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_PASSWORD: harar-test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_BUCKET: harar-sccache-linux-x64
      SCCACHE_REGION: auto
      SCCACHE_S3_USE_SSL: "true"
      SCCACHE_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_SCCACHE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SCCACHE_SECRET_ACCESS_KEY }}
      HARAR_TEST_DATABASE_URL: host=127.0.0.1 port=5432 user=postgres password=harar-test-only dbname=postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: sccache is required, on R2
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ] || [ -z "$SCCACHE_ENDPOINT" ]; then
            echo "::error::The R2 sccache keys are missing (public-ci environment). SCCACHE IS REQUIRED FOR ALL RUST COMPILATION."
            exit 1
          fi
          # R2_ENDPOINT keeps its https:// for the AWS CLI; sccache wants the
          # bare host and adds the scheme itself (SCCACHE_S3_USE_SSL).
          export SCCACHE_ENDPOINT="${SCCACHE_ENDPOINT#https://}"
          echo "SCCACHE_ENDPOINT=$SCCACHE_ENDPOINT" >> "$GITHUB_ENV"
          sccache --start-server
          sccache --show-stats | tee sccache-stats.txt
          grep -q "$SCCACHE_BUCKET" sccache-stats.txt || { echo "::error::sccache is not using the R2 bucket $SCCACHE_BUCKET"; exit 1; }
      - run: cargo check --locked --workspace --all-targets
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace
      # The harar crate's edge feature (harar::edge), off by default.
      - run: cargo test --locked -p harar --features edge
      # The `harar` crate is the only publishable one, at the release version,
      # and it builds from what it would upload, with crates.io dependencies alone.
      - run: scripts/check-crates.sh
      - run: cargo publish --dry-run --locked -p harar
      # harar edge: the CLI against a running edge (Node, node:sqlite), so the
      # Rust and TypeScript sides can't drift apart on the signature or the log.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: cargo build --locked -p harar-server --bin harar
      - run: edge/test/cli-e2e.sh target/debug/harar
      # Every client (TypeScript, Python, Ruby, PHP, Go, Rust) against that edge.
      - run: edge/test/clients-e2e.sh target/debug/harar
      - run: sccache --show-stats

  macos:
    # GitHub's macOS runners have a working Secure Enclave, so the enclave
    # tests run here for real.
    runs-on: macos-15
    # Compilation is cached in R2. public-ci holds only the key for this
    # repo's sccache buckets (the dsc model); publishing keys are in release.
    environment: public-ci
    # GitHub's Macs can't run containers; the Linux job covers the store.
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_BUCKET: harar-sccache-darwin-arm64
      SCCACHE_REGION: auto
      SCCACHE_S3_USE_SSL: "true"
      SCCACHE_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_SCCACHE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SCCACHE_SECRET_ACCESS_KEY }}
      HARAR_TEST_NO_POSTGRES: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: sccache is required, on R2
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ] || [ -z "$SCCACHE_ENDPOINT" ]; then
            echo "::error::The R2 sccache keys are missing (public-ci environment). SCCACHE IS REQUIRED FOR ALL RUST COMPILATION."
            exit 1
          fi
          # R2_ENDPOINT keeps its https:// for the AWS CLI; sccache wants the
          # bare host and adds the scheme itself (SCCACHE_S3_USE_SSL).
          export SCCACHE_ENDPOINT="${SCCACHE_ENDPOINT#https://}"
          echo "SCCACHE_ENDPOINT=$SCCACHE_ENDPOINT" >> "$GITHUB_ENV"
          sccache --start-server
          sccache --show-stats | tee sccache-stats.txt
          grep -q "$SCCACHE_BUCKET" sccache-stats.txt || { echo "::error::sccache is not using the R2 bucket $SCCACHE_BUCKET"; exit 1; }
      - run: cargo check --locked --workspace --all-targets
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace
      - run: sccache --show-stats
