# Publish the JavaScript client (js/, `import { vault } from 'harar'`) to npm.
# Run by a person: Actions → Publish to npm → Run workflow, after a change to
# js/ lands on main with its version bumped.
#
# npm trusted publishing (OIDC): npm trusts this workflow, by its filename,
# in the `release` environment. There is no NPM_TOKEN anywhere. Renaming this
# file breaks that trust. Provenance is automatic for a public package
# published from a public repo this way.
name: Publish to npm

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: npm test
      - run: bun test test/

  publish:
    needs: test
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write # OIDC: trusted publishing
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1, newer than Node 22 ships.
      # A major, pinned: an unpinned @latest once changed npm's output mid-run.
      - run: npm install -g npm@12 && npm --version
      # A version is published once; a rerun after it landed skips, not fails.
      - name: Publish
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "$(npm view "harar@$version" version 2>/dev/null || true)" = "$version" ]; then
            echo "harar@$version is already on npm"
          else
            npm publish --access public
          fi
      # Read it back: a green run means the version is on the registry.
      - name: Verify
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          for _ in $(seq 1 20); do
            if [ "$(npm view "harar@$version" version 2>/dev/null || true)" = "$version" ]; then
              echo "harar@$version is on npm"
              exit 0
            fi
            sleep 15
          done
          echo "harar@$version never appeared on npm" >&2
          exit 1
