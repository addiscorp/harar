# Every push to main becomes a canary build (the dsc model).
#
#   1. TAG = v<workspace version>-canary-<7-char sha> (scripts/version.sh).
#   2. Push TAG as an annotated tag. A push made with GITHUB_TOKEN starts no
#      workflow (GitHub's loop prevention), so:
#   3. dispatch release.yml against TAG; workflow_dispatch is the exception
#      that GITHUB_TOKEN may start.
#
# When v<version> already exists the version was promoted: nothing is built
# until a bump PR (scripts/bump-version.sh) lands.
name: Tag canary

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  tag-canary:
    name: Tag canary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Compute, push and dispatch the canary tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="$(scripts/version.sh)"
          if git rev-parse "v${V}" >/dev/null 2>&1; then
            echo "::warning::v${V} is already promoted; bump the version before the next canary"
            exit 0
          fi
          TAG="v${V}-canary-$(git rev-parse --short=7 HEAD)"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "canary tag ${TAG} already exists (re-run or duplicate push); nothing to do"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "harar canary ${TAG}"
          git push origin "$TAG"
          echo "pushed ${TAG}; dispatching release.yml against it"
          gh workflow run release.yml --repo "${{ github.repository }}" --ref "$TAG"
